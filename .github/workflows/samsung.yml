name: Samsung TV Plus EPG

on:
  schedule:
    - cron: "17 */4 * * *"      # every 4 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: samsung-epg
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests curl_cffi beautifulsoup4

      - name: Build playlist + extended EPG
        run: python -u generate.py

      - name: Publish to the "output" branch (overwritten each run, no history bloat)
        env:
          TOKEN: ${{ secrets.KEEPALIVE_PAT || github.token }}
        run: |
          mkdir pub && cp samsung.xml.gz samsung_report.txt pub/
          cd pub
          git init -q -b output
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Samsung TV Plus EPG $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
